org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true
fabric.loom.multiProjectOptimisation=true

# ---------------------------------------------------------------------------
# Mod metadata
# neoforge doesn't like "-" in mod ids
mod.id=maulves_scythes
mod.name=Maulve's Scythes
mod.version=2.0.0
mod.group=java.maulve
mod.main_package=maulve.scythes
mod.description=A Vanilla+ Mod that adds scythes
mod.license=MIT
mod.authors=Maulve

# ---------------------------------------------------------------------------
# Per-target versions. Keys are suffixed with the node's Minecraft version.
# To add a target: add a target(...) line in settings.gradle.kts and one set of keys here.

# Java release used to compile each target (Gradle itself should run on JDK 25)
java.1.20.4=17
java.1.21.1=21
java.1.21.4=21
java.1.21.11=21

# --- Fabric ---
fabric.loader=0.19.3

fabric.api.1.20.4=0.97.3+1.20.4
fabric.api.1.21.1=0.116.15+1.21.1
fabric.api.1.21.4=0.119.4+1.21.4
fabric.api.1.21.11=0.141.6+1.21.11

# Minecraft range written into fabric.mod.json (semver range syntax)
fabric.mc.1.20.4=>=1.20 <=1.20.4
fabric.mc.1.21.1=>=1.21 <=1.21.1
fabric.mc.1.21.4=1.21.4
fabric.mc.1.21.11=1.21.11

fabric.modmenu.1.20.4=9.2.0
fabric.modmenu.1.21.1=11.0.5
fabric.modmenu.1.21.4=13.0.4
fabric.modmenu.1.21.11=17.0.1

# --- NeoForge ---
# Version compiled against
neoforge.version.1.20.4=20.4.248
neoforge.version.1.21.1=21.1.265
neoforge.version.1.21.4=21.4.157
neoforge.version.1.21.11=21.11.48

# Ranges written into neoforge.mods.toml (Maven range syntax)
neoforge.range.1.20.4=[20.2,20.5)
neoforge.range.1.21.1=[21.0,21.2)
neoforge.range.1.21.4=[21.4,21.5)
neoforge.range.1.21.11=[21.11,21.12)

neoforge.mc.1.20.4=[1.20.2,1.20.4]
neoforge.mc.1.21.1=[1.21,1.21.1]
neoforge.mc.1.21.4=[1.21.4]
neoforge.mc.1.21.11=[1.21.11]
